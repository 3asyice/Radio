<div class="feed">
  <p><span>📹</span> video.mp4</p>
  <p class="text">
    Black Mirror (tv series) chronological order.
  </p>

  <!-- Campo de pesquisa -->
  <input type="text" id="searchVideo" placeholder="Pesquisar episódio..." style="width:100%;padding:6px;margin:10px 0;border-radius:6px;border:1px solid #ccc;">

  <!-- Container dos episódios -->
<div id="episodeVideo" style="display:flex; gap:10px; overflow-x:auto; padding:5px;"></div>

  <center>
    <video id="player_video" autoplay muted controls
      disablePictureInPicture
      controlsList="nodownload noremoteplayback noplaybackrate nopictureinpicture"
      preload="auto"
      width="100%">
    </video>
  </center>
</div>

<script>


  const playlistVideo = [
{
  title: "Copini - O Poder do Egoísmo",
  url: "https://ia600106.us.archive.org/8/items/vid-20240825-wa-0000/Copini%20%20-%20O%20PODER%20DO%20EGOISMO%20%EF%BD%9C%20Viva%20Sua%20Vida%20Como%20Se%20Ela%20Fosse%20Sua%20%23ep34.mp4"
},
{
  title: "Paiva - Como Deixar o Vício nas Redes Sociais",
  url: "https://ia600106.us.archive.org/8/items/vid-20240825-wa-0000/Paiva%20-%20Como%20Deixar%20o%20V%C3%ADcio%20nas%20Redes%20Sociais%20%28DICA%20PR%C3%81TICA%29.mp4"
},
{
  title: "Breno Perrucho - 7 Hábitos que me levaram do ZERO ao MILIONÁRIO em 16 meses",
  url: "https://ia800106.us.archive.org/8/items/vid-20240825-wa-0000/Breno_Perrucho_-_Jovens_de_Negocio_-_7_H%C3%A1bitos_que_me_levaram_do_ZERO_a_MILION%C3%81RIO_em_16_meses.mp4"
},
{
  title: "Eslen Delanogare - Como ser MELHOR que 99% das Pessoas",
  url: "https://ia800106.us.archive.org/8/items/vid-20240825-wa-0000/Eslen_Delanogare_-_COMO_SER_MELHOR_QUE_99%25_DAS_PESSOAS.mp4"
},
{
  title: "Miguel Expat - A ânsia de ter e o tédio de possuir",
  url: "https://ia800106.us.archive.org/8/items/vid-20240825-wa-0000/Miguel_Expat_-_A_%C3%A2nsia_de_ter_e_o_t%C3%A9dio_de_possuir.mp4"
},
{
  title: "Pinho - Você precisa escolher melhor seus pensamentos",
  url: "https://ia800106.us.archive.org/8/items/vid-20240825-wa-0000/Pinho_-_Voc%C3%AA_precisa_escolher_melhor_seus_pensamentos.mp4"
},
{
  title: "Cesar Roberto - Comece mesmo sem saber como",
  url: "https://ia800106.us.archive.org/8/items/vid-20240825-wa-0000/Cesar_Roberto_-_Comece_mesmo_sem_saber_como.mp4"
},
{
  title: "Copini - tá na hora de tu ser quem disse que seria",
  url: "https://ia600106.us.archive.org/8/items/vid-20240825-wa-0000/Copini%20%20-%20t%C3%A1%20na%20hora%20de%20tu%20ser%20quem%20disse%20que%20seria.mp4"
},
{
  title: "Breno Perrucho - Como criar uma mentalidade de sucesso",
  url: "https://ia800106.us.archive.org/8/items/vid-20240825-wa-0000/Breno_Perrucho_-_Jovens_de_Neg%C3%B3cios_-_Como_criar_uma_mentalidade_de_sucesso.mp4"
},
{
  title: "Fe Alves - Como ser 10X mais confiante - Roube a mentalidade dos maiores atletas do mundo",
  url: "https://ia600106.us.archive.org/8/items/vid-20240825-wa-0000/Fe_Alves_-_COMO_SER_10X_MAIS_CONFIANTE_-_ROUBE_A_MENTALIDADE_DOS_MAIORES_ATLETAS_DO_MUNDO.mp4"
}
  ];


  let indexVideo = 0;
  const playerLore = document.getElementById("player_video");
  const episodeVideo = document.getElementById("episodeVideo");
  const searchInput = document.getElementById("searchVideo");

  function renderVideos(filter = "") {
    episodeVideo.innerHTML = "";
    playlistVideo
      .filter(ep => ep.title.toLowerCase().includes(filter.toLowerCase()))
      .forEach((ep, i) => {
        const epDiv = document.createElement("div");
        epDiv.textContent = ep.title;
        epDiv.style.cursor = "pointer";
        epDiv.style.padding = "10px";
        epDiv.style.border = "1px solid #ccc";
        epDiv.style.borderRadius = "6px";
        epDiv.style.minWidth = "150px";
        epDiv.style.textAlign = "center";
        epDiv.style.background = "#f9f9f9";
        epDiv.style.flexShrink = "0"; // não encolhe no flex
        epDiv.onclick = () => {
          indexVideo = i;
          playerLore.src = ep.url;
          playerLore.play();
        };
        episodeVideo.appendChild(epDiv);
      });
  }

  searchInput.addEventListener("input", (e) => {
    renderVideos(e.target.value);
  });

  playerLore.src = playlistVideo[indexVideo].url;

  playerLore.addEventListener("ended", () => {
    indexVideo = (indexVideo + 1) % playlistVideo.length;
    playerLore.src = 
    playlistVideo[indexVideo].url;
    playerLore.play();
  });

  renderVideos();
</script>
