<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <title>Pesquisa Inteligente</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'VT323', monospace;
      background-color: #0b0b0b;
      color: #e0e0e0;
      line-height: 1.5;
      min-height: 100vh;
      padding: 20px;
    }

    header {
      text-align: center;
      margin-bottom: 30px;
    }

    header h1 {
      font-size: 2.2rem;
      color: #e0e0e0;
      text-transform: uppercase;
      letter-spacing: 1px;
      border-bottom: 1px solid #333;
      display: inline-block;
      padding-bottom: 5px;
    }

    main {
      max-width: 900px;
      margin: 0 auto;
      padding: 20px;
      background-color: #111;
      border-radius: 6px;
      border: 1px solid #222;
    }

    .search-box {
      display: flex;
      margin-bottom: 20px;
    }

    .search-box input {
      flex: 1;
      padding: 12px 16px;
      font-size: 1.2rem;
      border: 1px solid #444;
      border-radius: 4px;
      background-color: #0b0b0b;
      color: #e0e0e0;
      outline: none;
      transition: all 0.2s;
    }
    .search-box input:focus {
      border-color: #ff3333;
      box-shadow: 0 0 6px #ff3333;
    }

    .filters {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 10px 0;
    }

    .filters::-webkit-scrollbar {
      height: 6px;
    }
    .filters::-webkit-scrollbar-thumb {
      background-color: #333;
      border-radius: 3px;
    }

    .filters::-webkit-scrollbar-track {
      background-color: #111;
    }

    .filters button {
      flex: 0 0 auto;
      padding: 10px 18px;
      font-size: 1rem;
      border: 1px solid #333;
      border-radius: 4px;
      background-color: #111;
      color: #e0e0e0;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
      position: relative;
      overflow: hidden;
    }

    .filters button::before {
      content: "";
      position: absolute;
      top: 0; left: -100%;
      width: 100%;
      height: 100%;
      background: rgba(255, 0, 0, 0.2);
      transform: skewX(-20deg);
      transition: all 0.4s ease;
    }

    .filters button:hover::before {
      left: 100%;
    }

    .filters button:hover {
      color: #ff4d4d;
      border-color: #ff4d4d;
      box-shadow: 0 0 8px #ff4d4d;
    }

    a {
      color: #ff4d4d;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }

    /* Pequeno efeito glitch no hover */
    @keyframes glitch {
      0% { transform: translate(0); }
      20% { transform: translate(-1px, 1px); }
      40% { transform: translate(-2px, -1px); }
      60% { transform: translate(1px, 0); }
      80% { transform: translate(1px, -1px); }
      100% { transform: translate(0); }
    }

    .filters button:hover {
      animation: glitch 0.3s;
    }

  </style>
</head>
<body>
  <header>
    <h1>Pesquisa Inteligente</h1>
  </header>

  <main>
    <div class="search-box">
      <input id="searchInput" placeholder="Digite sua pesquisa...">
    </div>

    <div class="filters">
      <button onclick="doSearch(2)">Imagens</button>
      <button onclick="doSearch(7)">Vídeos</button>
      <button onclick="doSearch(1)">Locais</button>
      <button onclick="doSearch(12)">Notícias</button>
      <button onclick="doSearch(18)">Fóruns</button>
      <button onclick="doSearch(15)">Coisas legais</button>
      <button onclick="doSearch(8)">Vagas</button>
      <button onclick="doSearch(16)">Todos</button>
      <button onclick="doSearch(14)">Web</button>
    </div>
  </main>

  <script>
    function doSearch(udm) {
      const query = document.getElementById("searchInput").value.trim();
      if (!query) {
        alert("Por favor, insira um termo para pesquisar.");
        return;
      }
      const url = `https://www.google.com/search?q=${encodeURIComponent(query)}&udm=${udm}`;
      window.open(url, "_blank");
    }
  </script>
</body>
</html>
