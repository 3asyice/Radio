<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gerador de Poemas</title>

<style>
:root {
  --bg: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
  --card: rgba(255,255,255,0.08);
  --text: #f5f5f5;
  --accent: #ff4d6d;
}

body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg);
  font-family: "Inter", system-ui, sans-serif;
  color: var(--text);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.container {
  max-width: 600px;
  width: 100%;
  background: var(--card);
  backdrop-filter: blur(15px);
  border-radius: 20px;
  padding: 25px;
  box-shadow: 0 20px 40px rgba(0,0,0,0.4);
}

h1 {
  text-align: center;
  margin-bottom: 20px;
  font-weight: 600;
}

input, textarea {
  width: 100%;
  padding: 12px;
  margin-bottom: 12px;
  border-radius: 10px;
  border: none;
  background: rgba(255,255,255,0.15);
  color: var(--text);
  font-size: 15px;
}

input::placeholder,
textarea::placeholder {
  color: #ccc;
}

textarea {
  min-height: 120px;
  resize: vertical;
}

button {
  width: 100%;
  padding: 14px;
  border-radius: 12px;
  border: none;
  background: var(--accent);
  color: white;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  transition: transform 0.2s, box-shadow 0.2s;
}

button:hover {
  transform: translateY(-2px);
  box-shadow: 0 10px 25px rgba(255,77,109,0.4);
}

.result {
  margin-top: 20px;
}

.result textarea {
  min-height: 220px;
  background: rgba(0,0,0,0.35);
}
</style>
</head>

<body>

<div class="container">
  <h1>💌 Poema Personalizado</h1>

  <input id="nome" placeholder="Nome da pessoa amada">
  <input id="idade" placeholder="Idade (opcional)">
  <input id="data" placeholder="Data importante">
  <input id="sentimento" placeholder="Sentimento principal">
  <textarea id="momento" placeholder="Momento marcante, piada interna ou lembrança"></textarea>

  <button onclick="gerarPoema()">Gerar poema</button>

  <div class="result">
    <textarea id="resultado" placeholder="O poema aparecerá aqui..."></textarea>
  </div>
</div>

<script>
// Modelos de poemas com pesos (probabilidades)
const modelos = [
  {
    peso: 40,
    gerar: d => `
${d.nome},

Desde ${d.data}, o mundo desacelerou
quando você chegou.
O ${d.sentimento} não pediu licença,
apenas ficou.

${d.momento}

Não prometo eternidade,
mas prometo presença.
E isso, às vezes,
é mais raro que o infinito.
`
  },
  {
    peso: 30,
    gerar: d => `
${d.nome},

Existe algo em você
que nenhuma palavra alcança.
Talvez seja o jeito,
talvez seja o silêncio,
talvez seja nós.

${d.momento}

Se algum dia eu me perder,
que seja no caminho
que sempre volta para você.
`
  },
  {
    peso: 20,
    gerar: d => `
${d.nome},

Entre erros, risadas
e dias improváveis,
nos escolhemos.

${d.momento}

Se o amor é sorte,
então eu ganhei.
Se é destino,
então ele tem seu nome.
`
  },
  {
    peso: 10,
    gerar: d => `
${d.nome},

Não escrevo para impressionar,
escrevo porque sinto.

${d.momento}

E sentir você
é o ato mais honesto
que esse coração conhece.
`
  }
];

// Escolha probabilística
function escolherModelo() {
  const total = modelos.reduce((s, m) => s + m.peso, 0);
  let r = Math.random() * total;

  for (const m of modelos) {
    if (r < m.peso) return m;
    r -= m.peso;
  }
}

function gerarPoema() {
  const dados = {
    nome: nome.value || "Amor",
    idade: idade.value,
    data: data.value || "um dia que mudou tudo",
    sentimento: sentimento.value || "amor",
    momento: momento.value || "Mesmo sem palavras, nós sabíamos."
  };

  const modelo = escolherModelo();
  resultado.value = modelo.gerar(dados).trim();
}
</script>

</body>
</html>
