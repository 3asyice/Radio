<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel OSINT • Investigação Digital</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>
:root{
  --bg:#050607;
  --card:#0e1114;
  --text:#d0d0d0;
  --accent:#00ffc8;
  --border:#00bfa5;
  --danger:#ff3b3b;
}

body{
  margin:0;
  font-family:Arial, sans-serif;
  background:var(--bg);
  color:var(--text);
}

header{
  padding:15px;
  border-bottom:2px solid var(--accent);
  text-align:center;
}

header h1{
  margin:0;
  color:var(--accent);
  letter-spacing:2px;
}

.container{
  max-width:1200px;
  margin:auto;
  padding:20px;
}

.section{
  background:var(--card);
  border:1px solid var(--border);
  padding:15px;
  margin-bottom:20px;
}

.section h2{
  margin-top:0;
  color:var(--accent);
}

input, textarea, select, button{
  width:100%;
  background:#050607;
  color:#fff;
  border:1px solid var(--border);
  padding:10px;
  margin-top:8px;
}

button{
  cursor:pointer;
  font-weight:bold;
}

button.primary{
  background:var(--accent);
  color:#000;
}

button.link{
  background:#0b3b34;
  border:1px solid var(--accent);
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
  gap:15px;
}

.card{
  background:#0b0d10;
  border:1px solid #1c2228;
  padding:12px;
  font-size:14px;
}

.card img{
  max-width:100%;
  border:1px solid var(--border);
  margin-top:8px;
}

.tag{
  display:inline-block;
  padding:3px 8px;
  border:1px solid var(--border);
  color:var(--accent);
  font-size:11px;
  margin-right:5px;
  margin-top:4px;
}

small{
  color:#aaa;
  word-break:break-all;
}
</style>
</head>

<body>

<header>
  <h1>PAINEL OSINT</h1>
  <small>Documentação • Vigilância digital • Uso interno</small>
</header>

<div class="container">

<!-- REGISTRO -->
<div class="section">
<h2>📥 Registrar Prova</h2>

<input id="alvo" placeholder="Alvo / Perfil">
<select id="plataforma">
  <option>Instagram</option>
  <option>X (Twitter)</option>
  <option>Facebook</option>
  <option>TikTok</option>
  <option>Outro</option>
</select>

<input id="urlOriginal" placeholder="URL original observada">

<div style="display:flex;gap:10px;">
  <input id="printLink" placeholder="Link do print (Catbox, ImgBB...)">
  <button class="link" onclick="window.open('https://catbox.moe','_blank')">Abrir Catbox</button>
</div>

<select id="categoria">
  <option>Movimentação suspeita</option>
  <option>Contato frequente</option>
  <option>Padrão de comportamento</option>
  <option>Publicação relevante</option>
</select>

<input id="tags" placeholder="Tags livres (ex: #viagem #mentira #horário)">

<textarea id="descricao" rows="4" placeholder="Descrição técnica da evidência"></textarea>

<button class="primary" onclick="salvar()">Salvar Evidência</button>
</div>

<!-- BUSCA -->
<div class="section">
<h2>🔍 Busca Avançada</h2>
<input id="busca" placeholder="Buscar por alvo, tag, categoria ou texto..." oninput="render()">
</div>

<!-- MURAL -->
<div class="section" id="relatorio">
<h2>🧠 Mural Investigativo</h2>
<div class="grid" id="mural"></div>
</div>

<div style="display:flex;gap:10px;">
<button class="primary" onclick="exportarPDF()">📄 Exportar PDF</button>
<button class="primary" onclick="exportarJSON()">🧾 Exportar JSON Forense</button>
</div>

</div>

<script>
let banco = JSON.parse(localStorage.getItem("osint")) || [];

async function gerarHash(texto){
  const encoder = new TextEncoder();
  const data = encoder.encode(texto);
  const hashBuffer = await crypto.subtle.digest('SHA-256', data);
  return Array.from(new Uint8Array(hashBuffer))
    .map(b => b.toString(16).padStart(2,'0')).join('');
}

async function salvar(){
  if(!alvo.value || !descricao.value){
    alert("Alvo e descrição são obrigatórios.");
    return;
  }

  const conteudo = alvo.value + plataforma.value + urlOriginal.value + printLink.value + categoria.value + tags.value + descricao.value;
  const hash = await gerarHash(conteudo);

  banco.push({
    id: crypto.randomUUID(),
    alvo: alvo.value,
    plataforma: plataforma.value,
    url: urlOriginal.value,
    print: printLink.value,
    categoria: categoria.value,
    tags: tags.value.split(" ").filter(t=>t),
    descricao: descricao.value,
    data: new Date().toISOString(),
    hash_integridade: hash
  });

  localStorage.setItem("osint", JSON.stringify(banco));
  limpar();
  render();
}

function limpar(){
  alvo.value="";
  urlOriginal.value="";
  printLink.value="";
  tags.value="";
  descricao.value="";
}

function render(){
  const termo = busca.value?.toLowerCase() || "";
  mural.innerHTML="";

  banco.slice().reverse().filter(e=>{
    return JSON.stringify(e).toLowerCase().includes(termo);
  }).forEach(e=>{
    mural.innerHTML+=`
    <div class="card">
      <strong>${e.alvo}</strong><br>
      <small>${e.plataforma} • ${new Date(e.data).toLocaleString()}</small><br>
      <span class="tag">${e.categoria}</span><br>

      ${e.tags.map(t=>`<span class="tag">${t}</span>`).join("")}

      <p>${e.descricao}</p>

      ${e.url ? `<small>URL: <a href="${e.url}" target="_blank">${e.url}</a></small><br>`:""}
      ${e.print ? `<img src="${e.print}">`:""}

      <small>Hash (SHA-256): ${e.hash_integridade}</small>
    </div>`;
  });
}

function exportarPDF(){
  html2pdf().from(document.getElementById("relatorio")).save("Relatorio_OSINT.pdf");
}

function exportarJSON(){
  const blob = new Blob([JSON.stringify(banco,null,2)],{type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "evidencias_osint.json";
  a.click();
}

render();
</script>

</body>
</html>
