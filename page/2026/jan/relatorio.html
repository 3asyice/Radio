<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arquivo Investigativo</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;500;700&display=swap');
*{box-sizing:border-box}
body{
  margin:0;
  font-family:'IBM Plex Mono', monospace;
  background:#070707;
  color:#e0e0e0;
}
header{
  padding:20px;
  background:#000;
  border-bottom:1px solid #222;
}
header h1{font-size:18px;letter-spacing:3px;color:#9fd6c3}
main{
  max-width:900px;
  margin:40px auto;
  padding:30px;
  background:#0c0c0c;
  border:1px solid #1e1e1e;
}
h2{
  font-size:16px;
  border-left:4px solid #4fa38c;
  padding-left:10px;
  color:#bfe9dd;
  margin-top:40px;
}
label{display:block;margin-top:15px;font-size:13px;color:#aaa}
input,textarea,select{
  width:100%;
  margin-top:6px;
  padding:10px;
  background:#000;
  color:#e0e0e0;
  border:1px solid #333;
  font-family:'IBM Plex Mono', monospace;
}
textarea{min-height:90px}
button{
  margin-top:25px;
  background:#000;
  color:#9fd6c3;
  border:1px solid #4fa38c;
  padding:12px 18px;
  cursor:pointer;
}
button:hover{background:#111}
.timeline-item{
  border-left:2px solid #333;
  padding-left:15px;
  margin:20px 0;
}
.timeline-item span{color:#4fa38c;font-size:12px}
.export{
  margin-top:40px;
  background:#000;
  border:1px dashed #333;
  padding:20px;
}
.export textarea{
  width:100%;
  min-height:320px;
  background:#000;
  color:#8aff8a;
}
.report{
  background:#000;
  padding:30px;
  border-left:4px solid #4fa38c;
  color:#ddd;
}
.report h3{color:#4fa38c;margin-top:0}
.report .meta{font-size:12px;color:#777}
footer{text-align:center;color:#444;padding:20px;font-size:12px}
</style>
</head>
<body>
<header>
<h1>ARQUIVO • CONFIDENCIAL</h1>
</header>

<main>
<h2>Identificação do Caso</h2>
<form id="form">
<label>Código do Caso</label>
<input id="codigo" placeholder="TD-0009">
<label>Investigador</label>
<input id="investigador" placeholder="Identidade preservada">
<label>Data</label>
<input type="date" id="data">

<h2>Indivíduo / Evento Central</h2>
<label>Nome / Identificação</label>
<input id="nome">
<label>Apelido / Codinome</label>
<input id="apelido">
<label>Status Atual</label>
<select id="status"><option>Indeterminado</option><option>Vivo</option><option>Falecido</option></select>
<label>Localização Relevante</label>
<input id="local">

<h2>Observações de Campo</h2>
<textarea id="obs" placeholder="O que foi visto. Nada além disso."></textarea>

<h2>Padrões Identificados</h2>
<textarea id="padroes" placeholder="Tudo se repete. Só muda a forma."></textarea>

<h2>Hipóteses</h2>
<textarea id="hipoteses" placeholder="A verdade não precisa ser confortável."></textarea>

<h2>Linha do Tempo</h2>
<label>Evento 1</label>
<input id="t1d" placeholder="Data / Período">
<textarea id="t1"></textarea>
<label>Evento 2</label>
<input id="t2d" placeholder="Data / Período">
<textarea id="t2"></textarea>
<label>Evento 3</label>
<input id="t3d" placeholder="Data / Período">
<textarea id="t3"></textarea>

<h2>Conclusão Parcial</h2>
<textarea id="conclusao" placeholder="Nada termina. Só se arrasta."></textarea>

<button type="button" onclick="gerar()">Gerar + Exportar HTML</button>
</form>

<div class="export" id="export"></div>
</main>

<footer>
<p>Arquivo interno • observação contínua</p>
</footer>

<script>
function v(id){
  return document.getElementById(id).value || '-';
}

function gerar(){
  const output = document.getElementById('export');

  const html = `<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="author" content="AnonymousDetective">
<meta name="description" content="Relatório investigativo confidencial">
<title>Relatório ${v('codigo')}</title>

<style>
:root{
  --bg-main:#0b0c0d;
  --bg-panel:#121416;
  --border:#2b2e30;
  --text-main:#d6d6d6;
  --text-dim:#9a9a9a;
  --accent:#6f8f84;
  --danger:#8f6f6f;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:var(--bg-main);
  color:var(--text-main);
  font-family: "Courier New", Consolas, monospace;
  padding:40px;
}

.report{
  max-width:900px;
  margin:auto;
  background:var(--bg-panel);
  border:1px solid var(--border);
  padding:30px 35px;
}

/* Cabeçalho */
header{
  border-bottom:1px solid var(--border);
  margin-bottom:25px;
  padding-bottom:15px;
}

header h1{
  margin:0;
  font-size:20px;
  letter-spacing:1px;
  color:var(--accent);
  text-transform:uppercase;
}

header .meta{
  margin-top:8px;
  font-size:13px;
  color:var(--text-dim);
}

/* Seções */
.section{
  margin-bottom:28px;
}

.section-title{
  font-size:14px;
  text-transform:uppercase;
  letter-spacing:1px;
  color:var(--accent);
  border-left:3px solid var(--accent);
  padding-left:10px;
  margin-bottom:10px;
}

.section-content{
  font-size:14px;
  line-height:1.6;
  color:var(--text-main);
}

/* Dados-chave */
.key-data{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px 30px;
  font-size:14px;
}

.key-data span{
  color:var(--text-dim);
}

/* Timeline */
.timeline{
  border-left:2px solid var(--border);
  padding-left:20px;
}

.timeline-entry{
  margin-bottom:18px;
}

.timeline-entry span{
  display:block;
  font-size:12px;
  color:var(--accent);
  margin-bottom:4px;
}

/* Rodapé confidencial */
.confidential{
  margin-top:40px;
  padding-top:15px;
  border-top:1px solid var(--border);
  font-size:11px;
  color:var(--text-dim);
  letter-spacing:1px;
  text-transform:uppercase;
}
</style>
</head>

<body>

<div class="report">

<header>
  <h1>Relatório ${v('codigo')}</h1>
  <div class="meta">
    Investigador: ${v('investigador')}<br>
    Data do registro: ${v('data')}
  </div>
</header>

<div class="section">
  <div class="section-title">Indivíduo / Evento Central</div>
  <div class="section-content key-data">
    <div><span>Nome:</span> ${v('nome')} (${v('apelido')})</div>
    <div><span>Status:</span> ${v('status')}</div>
    <div><span>Local:</span> ${v('local')}</div>
  </div>
</div>

<div class="section">
  <div class="section-title">Observações de Campo</div>
  <div class="section-content">
    ${v('obs')}
  </div>
</div>

<div class="section">
  <div class="section-title">Padrões Identificados</div>
  <div class="section-content">
    ${v('padroes')}
  </div>
</div>

<div class="section">
  <div class="section-title">Hipóteses</div>
  <div class="section-content">
    ${v('hipoteses')}
  </div>
</div>

<div class="section">
  <div class="section-title">Linha do Tempo</div>
  <div class="timeline">
    <div class="timeline-entry">
      <span>${v('t1d')}</span>
      ${v('t1')}
    </div>
    <div class="timeline-entry">
      <span>${v('t2d')}</span>
      ${v('t2')}
    </div>
    <div class="timeline-entry">
      <span>${v('t3d')}</span>
      ${v('t3')}
    </div>
  </div>
</div>

<div class="section">
  <div class="section-title">Conclusão Parcial</div>
  <div class="section-content">
    ${v('conclusao')}
  </div>
</div>

<div class="confidential">
  Documento confidencial — uso restrito para investigação interna
</div>

</div>

</body>
</html>
`;

  output.innerHTML = `
    <h2>Exportação HTML limpa</h2>

    <textarea id="htmlGerado" readonly
      style="width:100%;min-height:360px;background:#000;color:#8aff8a;padding:12px;">
${html.replace(/</g, '&lt;').replace(/>/g, '&gt;')}
    </textarea>

    <button onclick="copiarHTML()" style="
      margin-top:15px;
      background:#000;
      color:#9fd6c3;
      border:1px solid #4fa38c;
      padding:10px 18px;
      cursor:pointer;
      font-family:monospace;
    ">
      📋 Copiar HTML completo
    </button>
  `;
}

function copiarHTML(){
  const textarea = document.getElementById('htmlGerado');

  textarea.select();
  textarea.setSelectionRange(0, 999999); // compatível mobile

  navigator.clipboard.writeText(textarea.value)
    .then(() => {
      // feedback silencioso estilo investigativo
      console.log('HTML copiado');
    })
    .catch(() => {
      alert('Não foi possível copiar automaticamente.');
    });
}
</script>

</body>
</html>
