<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat Terapêutico</title>
  <style>
    :root {
      --blue-dark: #0a2540;
      --blue-main: #1e88e5;
      --blue-light: #e3f2fd;
      --white: #ffffff;
    }

    * {
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      margin: 0;
      background: linear-gradient(180deg, var(--blue-dark), var(--blue-main));
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .app {
      width: 100%;
      max-width: 420px;
      height: 90vh;
      background: var(--white);
      border-radius: 16px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    header {
      background: var(--blue-main);
      color: white;
      padding: 16px;
      text-align: center;
      font-weight: bold;
    }

    .screen {
      padding: 16px;
      flex: 1;
      display: none;
      flex-direction: column;
      height: 100%;
    }

    .screen.active {
      display: flex;
    }

    input, button, textarea, select {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 14px;
    }

    button {
      background: var(--blue-main);
      color: white;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      opacity: 0.9;
    }

    .chat {
      flex: 1;
      overflow-y: auto;
      background: var(--blue-light);
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 10px;
      display: flex;
      flex-direction: column;
    }

    .msg {
      margin-bottom: 10px;
      padding: 10px;
      margin-bottom: 42px;
      border-radius: 8px;
      max-width: 85%;
      line-height: 1.4;
    }

    .bot {
      background: white;
      align-self: flex-start;
    }

    .user {
      background: var(--blue-main);
      color: white;
      align-self: flex-end;
    }

    footer {
      display: flex;
      gap: 8px;
      position: sticky;
      bottom: 0;
      background: var(--white);
      padding-top: 8px;
    }

    @media (max-width: 480px) {
      .app {
        height: 80vh;
        border-radius: 0;
      }
    }
  </style>
</head>
<body>

<div class="app">
  <header>
      <div>Chat Terapêutico</div>
      <small id="timer">Sessão: 60:00</small>
    </header>

  <!-- LOGIN -->
  <div class="screen active" id="loginScreen">
    <h3>Login</h3>
    <input type="text" id="username" placeholder="Usuário" />
    <select id="role">
      <option value="paciente">Paciente</option>
      <option value="profissional">Profissional</option>
    </select>
    <button onclick="login()">Entrar</button>
  </div>

  <!-- CHAT -->
  <div class="screen" id="chatScreen">
    <div class="chat" id="chat"></div>
<footer>
  <textarea id="answer" placeholder="Digite sua resposta..."></textarea>
  <button onclick="sendAnswer()">Enviar</button>
  <button onclick="endSessionEarly()" style="background:#0a2540">
    Encerrar sessão
  </button>
</footer>
  </div>
</div>

<script>
  const questions = [
    "Qual é o seu objetivo com a terapia?",
    "Quais são as suas preocupações no momento?",
    "O que ainda não está bem na sua vida?",
    "O que você deseja mudar no seu jeito de ser, pensar, se relacionar, trabalhar ou viver hoje?",
    "O que em sua vida faz com que você se sinta feliz?",
    "O que em sua vida faz com que você se sinta triste?",
    "Como você pode conseguir adicionar mais prazer à sua vida?",
    "Pelo que você é grato na sua vida?",
    "O que traz atualmente significado para a sua vida?",
    "O que traria significado para a sua vida no futuro?",
    "O que te impede de conseguir o que você deseja?",
    "Como costuma ser o seu humor no dia a dia?",
    "Como você lida com emoções negativas?",
    "Quais situações despertam mais ansiedade?",
    "Como você lida com o estresse?",
    "Como você vê a si mesmo?",
    "Como costuma lidar com os problemas?"
  ];

  const MAX_SESSIONS = 10;

  let currentQuestion = 0;
  let currentSession = 1;
  let sessionSeconds = 3600;
  let timerInterval = null;
  let userName = "";

  function login() {
    const name = document.getElementById("username").value.trim();
    if (!name) {
      alert("Digite um nome");
      return;
    }

    userName = name;

    document.getElementById("loginScreen").classList.remove("active");
    document.getElementById("chatScreen").classList.add("active");

    addBotMessage(
      `Olá ${userName}. Sessão ${currentSession} de ${MAX_SESSIONS}. Duração: 1 hora.`
    );

    startTimer();
    askQuestion();
  }

  function startTimer() {
    const timerEl = document.getElementById("timer");
    sessionSeconds = 3600;

    timerInterval = setInterval(() => {
      sessionSeconds--;

      const min = String(Math.floor(sessionSeconds / 60)).padStart(2, "0");
      const sec = String(sessionSeconds % 60).padStart(2, "0");
      timerEl.innerText = `Sessão ${currentSession}/10 • ${min}:${sec}`;

      if (sessionSeconds <= 0) {
        clearInterval(timerInterval);
        endSession();
      }
    }, 1000);
  }

  function endSession() {
    if (currentSession >= MAX_SESSIONS) {
      addBotMessage("🎓 Alta terapêutica concedida.");
      addBotMessage(
        "Você concluiu o processo terapêutico. Parabéns pelo comprometimento com sua saúde emocional."
      );
      addBotMessage("Sessão encerrada.");

      setTimeout(() => location.reload(), 7000);
      return;
    }

    addBotMessage(
      `⏱️ Sessão ${currentSession} encerrada. Nos vemos na próxima sessão.`
    );

    currentSession++;
    currentQuestion = 0;

    setTimeout(() => {
      addBotMessage(
        `Iniciando sessão ${currentSession} de ${MAX_SESSIONS}.`
      );
      startTimer();
      askQuestion();
    }, 4000);
  }

  function askQuestion() {
    if (currentQuestion < questions.length) {
      addBotMessage(questions[currentQuestion]);
    } else {
      addBotMessage(
        "As perguntas desta sessão foram concluídas. Use o tempo restante para reflexão ou converse com o criador +55 55 99163-9092"
      );
    }
  }

  function sendAnswer() {
    if (sessionSeconds <= 0) return;

    const input = document.getElementById("answer");
    const text = input.value.trim();
    if (!text) return;

    addUserMessage(text);
    input.value = "";

    currentQuestion++;
    setTimeout(askQuestion, 400);
  }

  function addBotMessage(text) {
    const chat = document.getElementById("chat");
    const div = document.createElement("div");
    div.className = "msg bot";
    div.innerText = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  }

  function addUserMessage(text) {
    const chat = document.getElementById("chat");
    const div = document.createElement("div");
    div.className = "msg user";
    div.innerText = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  }
</script>
<script>
  function endSessionEarly() {
    if (!confirm("Tem certeza que deseja encerrar a sessão agora?")) return;

    clearInterval(timerInterval);

    addBotMessage("🛑 Sessão encerrada manualmente antes do tempo.");

    endSession();
  }
</script>

</body>
</html>
