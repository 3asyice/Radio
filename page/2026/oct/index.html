<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b1017">
<title>Stockroom | Estoque & Bar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#0b1017;--panel:#111a25;--panel2:#0e1721;--line:#243345;--text:#edf3fa;--muted:#91a2b7;--green:#35d39a;--blue:#60a5fa;--amber:#f7b955;--red:#fb7185;--purple:#c4a1ff;--radius:15px}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 75% -15%,#17314a 0,transparent 42%),var(--bg);color:var(--text);font:14px 'DM Sans',sans-serif;min-height:100vh}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:9px;padding:10px 13px;color:var(--text);background:#172434;transition:.18s}button:hover{filter:brightness(1.15);transform:translateY(-1px)}button.primary{background:var(--green);color:#062117;border-color:var(--green);font-weight:800}button.danger{color:#ffc0c9;border-color:#743444;background:#2a1720}button.ghost{background:transparent}.app{display:grid;grid-template-columns:228px minmax(0,1fr);min-height:100vh}.sidebar{background:#0a1119;border-right:1px solid var(--line);padding:23px 14px;display:flex;flex-direction:column;gap:24px}.brand{display:flex;align-items:center;gap:11px;padding:0 8px}.brandmark{width:39px;height:39px;border-radius:12px;background:linear-gradient(135deg,#ff6577,#d52e4c);display:grid;place-items:center;font-size:20px;font-weight:800;color:white}.brand b{font:800 16px Manrope;letter-spacing:.02em;display:block}.brand small{color:var(--muted);font-size:10px;letter-spacing:.15em;text-transform:uppercase}.nav{display:grid;gap:5px}.nav button{display:flex;align-items:center;gap:12px;text-align:left;background:transparent;border-color:transparent;color:#afbdce;padding:12px}.nav button.active,.nav button:hover{background:#172534;border-color:#2a3b4e;color:white}.nav .ico{width:20px;text-align:center;font-size:17px}.sidebar-note{margin-top:auto;color:var(--muted);font-size:12px;line-height:1.6;padding:10px}.main{min-width:0}.topbar{height:72px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;gap:15px}.topbar h1{font:800 18px Manrope;margin:0}.topbar p{margin:4px 0 0;color:var(--muted);font-size:12px}.top-actions{display:flex;gap:8px;align-items:center}.content{padding:25px 28px 35px;max-width:1600px;margin:auto}.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:20px}.page-head h2{font:800 25px Manrope;margin:0 0 5px}.page-head p{margin:0;color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;margin-bottom:18px}.metric,.card{background:linear-gradient(145deg,rgba(20,32,46,.97),rgba(13,22,32,.97));border:1px solid var(--line);border-radius:var(--radius)}.metric{padding:17px}.metric-top{display:flex;justify-content:space-between;color:var(--muted);font-size:12px}.metric-icon{font-size:20px}.metric strong{font:800 27px Manrope;display:block;margin:9px 0 4px}.metric small{color:var(--muted)}.grid{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(280px,1fr);gap:16px}.card{padding:17px;min-width:0}.card-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.card-head h3{font:700 15px Manrope;margin:0}.card-head p{color:var(--muted);margin:4px 0 0;font-size:12px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th{text-align:left;color:#91a4bb;font-size:11px;text-transform:uppercase;letter-spacing:.06em;padding:11px 9px;background:#101d2a}td{padding:11px 9px;border-bottom:1px solid #1c2b3a;font-size:12px}tbody tr:hover{background:#152333}.status{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:4px 8px;font-size:11px;background:#123126;color:#76e6bb}.status.warn{background:#352918;color:#ffd38a}.status.bad{background:#381c25;color:#ff9eae}.dot{width:6px;height:6px;border-radius:50%;background:currentColor}.row-actions{display:flex;gap:5px}.row-actions button{padding:5px 7px;font-size:11px}.stack{display:grid;gap:15px}.list{display:grid;gap:0}.list-item{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid #1d2a38}.list-item:last-child{border-bottom:0}.list-item b{font-size:12px}.list-item small{display:block;color:var(--muted);margin-top:4px}.list-item .right{text-align:right;white-space:nowrap}.quick{display:grid;grid-template-columns:1fr 1fr;gap:8px}.quick button{text-align:left;min-height:48px}.empty{padding:30px;text-align:center;color:var(--muted)}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px}.toolbar input,.toolbar select{max-width:100%;min-width:150px}.field{display:grid;gap:6px;margin-bottom:13px}.field label{font-size:12px;color:#b8c6d7}.field input,.field select,.field textarea,.toolbar input,.toolbar select{width:100%;padding:11px 12px;border:1px solid #304256;border-radius:9px;background:#0a131d;color:var(--text);outline:none}.field input:focus,.field select:focus,.toolbar input:focus{border-color:var(--green)}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 13px}.field.full{grid-column:1/-1}.modal-backdrop{position:fixed;inset:0;background:#02060bd9;display:none;align-items:center;justify-content:center;padding:18px;z-index:10}.modal-backdrop.open{display:flex}.modal{width:min(600px,100%);max-height:90vh;overflow:auto;background:#111b27;border:1px solid #34485d;border-radius:16px;padding:22px;box-shadow:0 30px 100px #0009}.modal h2{font:800 20px Manrope;margin:0 0 18px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:15px}.toast{position:fixed;bottom:20px;right:20px;background:#152b25;border:1px solid #2d765a;padding:13px 17px;border-radius:10px;display:none;z-index:20;max-width:min(90vw,420px)}.toast.show{display:block}.notice{border:1px solid #594725;background:#282116;color:#f7dca5;padding:12px;border-radius:10px;line-height:1.5;font-size:12px;margin-bottom:16px}.notice strong{color:#ffe9ba}.hidden{display:none!important}.muted{color:var(--muted)}.report-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.report-tile{border:1px solid var(--line);border-radius:12px;padding:16px;background:#101a26}.report-tile b{display:block;margin-bottom:7px}.report-tile p{color:var(--muted);font-size:12px;margin:0 0 12px}.footer{padding:15px 28px;border-top:1px solid var(--line);color:#71839a;font-size:11px;display:flex;justify-content:space-between;gap:10px}.config-panel{max-width:650px}.mobile-menu{display:none}
@media(max-width:1100px){.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.grid{grid-template-columns:1fr}.report-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:720px){.app{grid-template-columns:1fr}.sidebar{position:fixed;z-index:5;inset:0 auto 0 0;width:245px;transform:translateX(-105%);transition:.2s;box-shadow:20px 0 50px #0008}.sidebar.open{transform:translateX(0)}.mobile-menu{display:inline-block}.topbar{padding:0 15px;height:64px}.content{padding:18px 13px 25px}.topbar h1{font-size:15px}.topbar p{display:none}.page-head{align-items:flex-start;flex-direction:column}.page-head h2{font-size:22px}.metrics{gap:8px}.metric{padding:13px}.metric strong{font-size:22px}.card{padding:12px}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.report-grid{grid-template-columns:1fr}.footer{padding:13px;flex-direction:column}.quick{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar" id="sidebar">
  <div class="brand"><div class="brandmark">S</div><div><b>STOCKROOM</b><small>RESTAURANTE & BAR</small></div></div>
  <nav class="nav" id="nav">
    <button class="active" data-page="dashboard"><span class="ico">▦</span>Dashboard</button>
    <button data-page="products"><span class="ico">▤</span>Produtos</button>
    <button data-page="sales"><span class="ico">🛒</span>Vendas do bar</button>
    <button data-page="movements"><span class="ico">⇄</span>Retiradas e entradas</button>
    <button data-page="cheeses"><span class="ico">◈</span>Queijos</button>
    <button data-page="salami"><span class="ico">◉</span>Salames & validades</button>
    <button data-page="suppliers"><span class="ico">▣</span>Fornecedores</button>
    <button data-page="shopping"><span class="ico">☷</span>Lista de compras</button>
    <button data-page="inventory"><span class="ico">▧</span>Inventário</button>
    <button data-page="reports"><span class="ico">▥</span>Relatórios & backup</button>
    <button data-page="settings"><span class="ico">⚙</span>Configurações</button>
  </nav>
  <div class="sidebar-note">Controle simples. Estoque organizado.<br><span id="connectionLabel">Modo de configuração</span></div>
</aside>
<main class="main">
<header class="topbar"><div style="display:flex;align-items:center;gap:12px"><button class="mobile-menu" id="menuBtn">☰</button><div><h1 id="topTitle">Visão geral</h1><p id="todayText">Seu estoque em um só lugar.</p></div></div><div class="top-actions"><span class="status warn" id="syncStatus"><span class="dot"></span>Não configurado</span></div></header>
<div class="content" id="content"></div>
<footer class="footer"><span>STOCKROOM · Gestão de estoque e bar</span><span>Backup manual disponível em Relatórios</span></footer>
</main>
</div>
<div class="modal-backdrop" id="modalBackdrop"><section class="modal"><div id="modalContent"></div></section></div>
<div class="toast" id="toast"></div>
<script>
/* CONFIGURAÇÃO CENTRAL: cole a URL e a chave pública (anon/publishable) do projeto Supabase em Configurações.
   Não use service_role key no navegador. Para produção, configure RLS conforme README. */
const CONFIG = {
  supabaseUrl: "",
  supabaseAnonKey: "",
  currency: "BRL",
  lowStockDefault: 10,
  expiryWarningDays: 7,
  defaultProducts: [
    ["Pepsi","Bebidas","un",8,24],["Pepsi Black","Bebidas","un",8,12],["Guaraná","Bebidas","un",8,24],["Guaraná Zero","Bebidas","un",8,12],
    ["Soda Limonada","Bebidas","un",8,12],["Sukita Laranja","Bebidas","un",8,12],["Sukita Uva","Bebidas","un",8,12],["Tônica","Bebidas","un",8,12],["Tônica Zero","Bebidas","un",8,12],
    ["Suco de Laranja","Sucos","un",12,6],["Suco de Uva","Sucos","un",12,6],["Limonada Preparada","Sucos","un",12,6],
    ["Água sem Gás 500ml","Águas","un",6,12],["Água com Gás 500ml","Águas","un",6,12],
    ["Queijo Gorgonzola","Queijos","kg",0,1],["Queijo Gouda","Queijos","kg",0,1],["Queijo Parmesão","Queijos","kg",0,1],["Queijo Brie","Queijos","kg",0,1],["Queijo Provolone","Queijos","kg",0,1],["Queijo Cinco Divisas","Queijos","kg",0,1],["Queijo Emmental","Queijos","kg",0,1],
    ["Salame Italiano","Salames","kg",0,1],["Salame Tipo Hambúrguer","Salames","kg",0,1],["Salame Copa","Salames","kg",0,1]
  ]
};
const $=s=>document.querySelector(s);
const state={page:"dashboard",products:[],movements:[],sales:[],suppliers:[],batches:[],client:null,localMode:true};
const fmtMoney=n=>Number(n||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const fmtQty=(n,unit="un")=>`${Number(n||0).toLocaleString("pt-BR",{maximumFractionDigits:3})} ${unit}`;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const dateToday=()=>new Date().toISOString().slice(0,10);
const dateBR=d=>d?new Date(d+"T12:00:00").toLocaleDateString("pt-BR"):"—";
function toast(msg){const el=$("#toast");el.textContent=msg;el.classList.add("show");setTimeout(()=>el.classList.remove("show"),3200)}
function saveLocal(){localStorage.setItem("stockroom-data-v1",JSON.stringify({products:state.products,movements:state.movements,sales:state.sales,suppliers:state.suppliers,batches:state.batches}));}
function loadLocal(){try{const d=JSON.parse(localStorage.getItem("stockroom-data-v1")||"{}");for(const k of ["products","movements","sales","suppliers","batches"])state[k]=d[k]||[];}catch{}}
function uid(){return crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2)}
function seedProducts(){if(state.products.length)return;state.products=CONFIG.defaultProducts.map(([name,category,unit,price,min])=>({id:uid(),name,category,unit,price,minStock:min,stock:0,active:true,createdAt:new Date().toISOString()}));saveLocal()}
async function init(){
 loadLocal(); seedProducts();
 if(CONFIG.supabaseUrl&&CONFIG.supabaseAnonKey&&window.supabase){try{state.client=window.supabase.createClient(CONFIG.supabaseUrl,CONFIG.supabaseAnonKey);await pullCloud();state.localMode=false;$("#syncStatus").className="status";$("#syncStatus").innerHTML='<span class="dot"></span>Online';$("#connectionLabel").textContent="Banco conectado";}catch(e){console.error(e);$("#syncStatus").className="status bad";$("#syncStatus").textContent="Falha na conexão";}}
 else {$("#syncStatus").className="status warn";$("#syncStatus").textContent="Modo local";$("#connectionLabel").textContent="Dados neste navegador";}
 $("#todayText").textContent=new Date().toLocaleDateString("pt-BR",{weekday:"long",day:"2-digit",month:"long",year:"numeric"});
 render();
}
async function pullCloud(){
 const tables=["products","movements","sales","suppliers","batches"];
 for(const t of tables){const {data,error}=await state.client.from(t).select("*");if(error)throw error;state[t]=data||[];}
}
async function persist(table,row,operation="upsert"){
 if(state.client){const {error}=operation==="delete"?await state.client.from(table).delete().eq("id",row.id):await state.client.from(table).upsert(row);if(error){toast("Erro no banco: "+error.message);throw error;}}
 saveLocal();
}
const pageNames={dashboard:"Visão geral",products:"Produtos",sales:"Vendas do bar",movements:"Retiradas e entradas",cheeses:"Controle de queijos",salami:"Salames & validades",suppliers:"Fornecedores",shopping:"Lista de compras",inventory:"Inventário",reports:"Relatórios & backup",settings:"Configurações"};
$("#nav").addEventListener("click",e=>{const b=e.target.closest("button[data-page]");if(!b)return;state.page=b.dataset.page;$("#sidebar").classList.remove("open");render()});
$("#menuBtn").addEventListener("click",()=>$("#sidebar").classList.toggle("open"));
function setContent(html){$("#content").innerHTML=html;$("#topTitle").textContent=pageNames[state.page]||"Stockroom";$("#nav").querySelectorAll("button").forEach(b=>b.classList.toggle("active",b.dataset.page===state.page))}
function header(title,subtitle,actions=""){return `<div class="page-head"><div><h2>${title}</h2><p>${subtitle}</p></div><div class="actions">${actions}</div></div>`}
function card(title,body,sub=""){return `<section class="card"><div class="card-head"><div><h3>${title}</h3>${sub?`<p>${sub}</p>`:""}</div></div>${body}</section>`}
function statusStock(p){if(Number(p.stock)<=0)return '<span class="status bad"><i class="dot"></i>Sem estoque</span>';if(Number(p.stock)<=Number(p.minStock||CONFIG.lowStockDefault))return '<span class="status warn"><i class="dot"></i>Estoque baixo</span>';return '<span class="status"><i class="dot"></i>Disponível</span>'}
function expiring(){const now=new Date(dateToday()+"T00:00:00");return state.batches.filter(b=>b.expiry).map(b=>({...b,days:Math.ceil((new Date(b.expiry+"T00:00:00")-now)/86400000)})).filter(b=>b.days<=CONFIG.expiryWarningDays).sort((a,b)=>a.days-b.days)}
function dashboard(){
 const low=state.products.filter(p=>Number(p.stock)<=Number(p.minStock||0)&&Number(p.minStock||0)>0), expires=expiring(), todaySales=state.sales.filter(s=>String(s.created_at||s.date||"").slice(0,10)===dateToday()), total=todaySales.reduce((a,s)=>a+Number(s.total||0),0);
 const drink=state.products.filter(p=>["Bebidas","Sucos","Águas"].includes(p.category));
 const recent=state.movements.slice().sort((a,b)=>String(b.created_at||"").localeCompare(String(a.created_at||""))).slice(0,6);
 setContent(header("Bom dia. Vamos organizar o estoque?","Resumo operacional do restaurante.",`<button class="primary" onclick="openSale()">＋ Registrar venda</button><button onclick="openMovement('saida')">⇄ Registrar retirada</button><button onclick="openProduct()">＋ Produto</button>`)+
 `<div class="metrics">
 <div class="metric"><div class="metric-top"><span>Produtos cadastrados</span><span class="metric-icon">▤</span></div><strong>${state.products.length}</strong><small>Itens no catálogo</small></div>
 <div class="metric"><div class="metric-top"><span>Estoque baixo</span><span class="metric-icon" style="color:var(--amber)">⚠</span></div><strong>${low.length}</strong><small>Precisam de atenção</small></div>
 <div class="metric"><div class="metric-top"><span>Validade próxima</span><span class="metric-icon" style="color:var(--red)">◷</span></div><strong>${expires.length}</strong><small>Nos próximos ${CONFIG.expiryWarningDays} dias ou vencidos</small></div>
 <div class="metric"><div class="metric-top"><span>Vendas do dia</span><span class="metric-icon" style="color:var(--green)">↗</span></div><strong>${fmtMoney(total)}</strong><small>${todaySales.length} registro(s) de venda</small></div></div>
 <div class="grid"><div class="stack">${card("Estoque de bebidas",`<div class="table-wrap"><table><thead><tr><th>Produto</th><th>Estoque</th><th>Preço</th><th>Status</th></tr></thead><tbody>${drink.map(p=>`<tr><td>${esc(p.name)}</td><td>${fmtQty(p.stock,p.unit)}</td><td>${fmtMoney(p.price)}</td><td>${statusStock(p)}</td></tr>`).join("")}</tbody></table></div><div style="margin-top:12px"><button onclick="go('products')">Ver todos os produtos →</button></div>`)}
 ${card("Movimentações recentes",recent.length?`<div class="list">${recent.map(m=>`<div class="list-item"><div><b>${esc(m.product_name||"Produto")}</b><small>${esc(m.reason||m.type||"Movimentação")} · ${dateBR(String(m.created_at||"").slice(0,10))}</small></div><div class="right"><b>${m.type==="saida"?"−":"+"}${fmtQty(m.quantity,m.unit||"un")}</b></div></div>`).join("")}</div>`:'<div class="empty">Nenhuma movimentação registrada.</div>')}</div>
 <div class="stack">${card("Alertas de estoque",low.length?`<div class="list">${low.slice(0,8).map(p=>`<div class="list-item"><div><b>${esc(p.name)}</b><small>Disponível: ${fmtQty(p.stock,p.unit)} · mínimo: ${fmtQty(p.minStock,p.unit)}</small></div><span class="status warn">Baixo</span></div>`).join("")}</div>`:'<div class="empty">Nenhum estoque baixo. Bom trabalho!</div>')}
 ${card("Validades próximas",expires.length?`<div class="list">${expires.slice(0,7).map(b=>`<div class="list-item"><div><b>${esc(batchProductName(b))}</b><small>Lote: ${esc(b.lot||"sem identificação")} · ${dateBR(b.expiry)}</small></div><span class="status ${b.days<0?"bad":"warn"}">${b.days<0?"Vencido":b.days===0?"Hoje":b.days+" dia(s)"}</span></div>`).join("")}</div>`:'<div class="empty">Nenhuma validade próxima cadastrada.</div>')}
 ${card("Ações rápidas",`<div class="quick"><button onclick="openMovement('entrada')">＋ Registrar entrada</button><button onclick="openMovement('saida')">− Registrar retirada</button><button onclick="openBatch()">◷ Cadastrar lote/validade</button><button onclick="go('shopping')">☷ Lista de compras</button></div>`)}</div></div>`);
}
function batchProductName(b){return state.products.find(p=>p.id===b.product_id)?.name||b.product_name||"Produto removido"}
function productsPage(filter=""){
 const rows=state.products.filter(p=>`${p.name} ${p.category}`.toLowerCase().includes(filter.toLowerCase()));
 setContent(header("Produtos","Cadastre bebidas, queijos, salames e qualquer outro item.",`<button class="primary" onclick="openProduct()">＋ Novo produto</button>`)+`<div class="toolbar"><input id="productSearch" placeholder="Buscar produto ou categoria..." value="${esc(filter)}"><select id="categoryFilter"><option value="">Todas as categorias</option>${["Bebidas","Sucos","Águas","Queijos","Salames","Outros"].map(c=>`<option>${c}</option>`).join("")}</select><button onclick="exportCSV('products')">Exportar CSV</button></div>${card("Catálogo de produtos",`<div class="table-wrap"><table><thead><tr><th>Produto</th><th>Categoria</th><th>Unidade</th><th>Estoque</th><th>Mínimo</th><th>Preço venda</th><th>Status</th><th>Ações</th></tr></thead><tbody>${rows.map(p=>`<tr><td><b>${esc(p.name)}</b></td><td>${esc(p.category)}</td><td>${esc(p.unit)}</td><td>${fmtQty(p.stock,p.unit)}</td><td>${fmtQty(p.minStock,p.unit)}</td><td>${fmtMoney(p.price)}</td><td>${statusStock(p)}</td><td><div class="row-actions"><button onclick="openProduct('${p.id}')">Editar</button><button class="danger" onclick="deleteProduct('${p.id}')">×</button></div></td></tr>`).join("")||'<tr><td colspan="8" class="empty">Nenhum produto encontrado.</td></tr>'}</tbody></table></div>` )}`);
 $("#productSearch").addEventListener("input",e=>productsPage(e.target.value));
 $("#categoryFilter").addEventListener("change",e=>{const q=$("#productSearch").value;const cat=e.target.value;const filtered=state.products.filter(p=>`${p.name} ${p.category}`.toLowerCase().includes(q.toLowerCase())&&(!cat||p.category===cat));const tbody=$("#content tbody");tbody.innerHTML=filtered.map(p=>`<tr><td><b>${esc(p.name)}</b></td><td>${esc(p.category)}</td><td>${esc(p.unit)}</td><td>${fmtQty(p.stock,p.unit)}</td><td>${fmtQty(p.minStock,p.unit)}</td><td>${fmtMoney(p.price)}</td><td>${statusStock(p)}</td><td><div class="row-actions"><button onclick="openProduct('${p.id}')">Editar</button><button class="danger" onclick="deleteProduct('${p.id}')">×</button></div></td></tr>`).join("")});
}
function movementPage(){setContent(header("Retiradas e entradas","Toda movimentação fica registrada com motivo e responsável.",`<button onclick="openMovement('entrada')">＋ Entrada</button><button class="primary" onclick="openMovement('saida')">− Retirada</button>`)+card("Histórico de movimentações",`<div class="toolbar"><input id="moveSearch" placeholder="Buscar produto, motivo ou responsável..."><select id="moveType"><option value="">Todos os tipos</option><option value="entrada">Entrada</option><option value="saida">Retirada</option><option value="ajuste">Ajuste</option></select></div><div class="table-wrap"><table><thead><tr><th>Data</th><th>Produto</th><th>Tipo</th><th>Quantidade</th><th>Motivo</th><th>Responsável</th></tr></thead><tbody id="movesBody"></tbody></table></div>`));filterMoves()}
function filterMoves(){const q=($("#moveSearch")?.value||"").toLowerCase(),type=$("#moveType")?.value||"";const rows=state.movements.filter(m=>(!type||m.type===type)&&`${m.product_name} ${m.reason} ${m.responsible}`.toLowerCase().includes(q)).sort((a,b)=>String(b.created_at).localeCompare(String(a.created_at)));$("#movesBody").innerHTML=rows.map(m=>`<tr><td>${dateBR(String(m.created_at||"").slice(0,10))}</td><td>${esc(m.product_name)}</td><td>${esc(m.type)}</td><td>${fmtQty(m.quantity,m.unit)}</td><td>${esc(m.reason)}</td><td>${esc(m.responsible||"—")}</td></tr>`).join("")||'<tr><td colspan="6" class="empty">Nenhuma movimentação encontrada.</td></tr>';$("#moveSearch").oninput=filterMoves;$("#moveType").onchange=filterMoves}
function salesPage(){const rows=state.sales.slice().sort((a,b)=>String(b.created_at).localeCompare(String(a.created_at)));setContent(header("Vendas do bar","Registre cada venda e acompanhe o fechamento diário.",`<button class="primary" onclick="openSale()">＋ Nova venda</button>`)+`<div class="metrics"><div class="metric"><div class="metric-top">Faturamento hoje</div><strong>${fmtMoney(rows.filter(s=>String(s.created_at).slice(0,10)===dateToday()).reduce((a,s)=>a+Number(s.total),0))}</strong></div><div class="metric"><div class="metric-top">Vendas hoje</div><strong>${rows.filter(s=>String(s.created_at).slice(0,10)===dateToday()).length}</strong></div></div>`+card("Histórico de vendas",`<div class="table-wrap"><table><thead><tr><th>Data/hora</th><th>Itens</th><th>Total</th><th>Responsável</th><th>Observação</th></tr></thead><tbody>${rows.map(s=>`<tr><td>${new Date(s.created_at).toLocaleString("pt-BR")}</td><td>${esc((s.items||[]).map(i=>`${i.name} × ${i.quantity}`).join(", "))}</td><td><b>${fmtMoney(s.total)}</b></td><td>${esc(s.responsible||"—")}</td><td>${esc(s.note||"—")}</td></tr>`).join("")||'<tr><td colspan="5" class="empty">Nenhuma venda registrada.</td></tr>'}</tbody></table></div>`))}
function categoryPage(category,title,subtitle){const ps=state.products.filter(p=>p.category===category);setContent(header(title,subtitle,`<button class="primary" onclick="openProduct('', '${category}')">＋ Cadastrar ${category==="Queijos"?"queijo":category==="Salames"?"salame":"produto"}</button><button onclick="openMovement('saida','${category}')">Registrar corte/retirada</button>`)+`<div class="metrics"><div class="metric"><div class="metric-top">Tipos cadastrados</div><strong>${ps.length}</strong></div><div class="metric"><div class="metric-top">Peso em estoque</div><strong>${ps.reduce((a,p)=>a+Number(p.stock||0),0).toLocaleString("pt-BR",{maximumFractionDigits:2})} kg/un</strong></div><div class="metric"><div class="metric-top">Estoque baixo</div><strong>${ps.filter(p=>p.stock<=p.minStock).length}</strong></div></div>`+card("Produtos",`<div class="table-wrap"><table><thead><tr><th>Produto</th><th>Estoque</th><th>Unidade</th><th>Mínimo</th><th>Ações</th></tr></thead><tbody>${ps.map(p=>`<tr><td><b>${esc(p.name)}</b></td><td>${fmtQty(p.stock,p.unit)}</td><td>${esc(p.unit)}</td><td>${fmtQty(p.minStock,p.unit)}</td><td><div class="row-actions"><button onclick="openMovement('saida','${category}','${p.id}')">Corte/retirada</button><button onclick="openProduct('${p.id}')">Editar</button><button onclick="openBatch('${p.id}')">Lote/validade</button></div></td></tr>`).join("")||'<tr><td colspan="5" class="empty">Cadastre os produtos para começar.</td></tr>'}</tbody></table></div>`)+card("Lotes e validades",`<div class="table-wrap"><table><thead><tr><th>Produto</th><th>Lote</th><th>Quantidade</th><th>Validade</th><th>Situação</th></tr></thead><tbody>${state.batches.filter(b=>ps.some(p=>p.id===b.product_id)).sort((a,b)=>String(a.expiry).localeCompare(String(b.expiry))).map(b=>`<tr><td>${esc(batchProductName(b))}</td><td>${esc(b.lot||"—")}</td><td>${fmtQty(b.quantity,b.unit||"kg")}</td><td>${dateBR(b.expiry)}</td><td>${batchStatus(b)}</td></tr>`).join("")||'<tr><td colspan="5" class="empty">Nenhum lote/validade cadastrado.</td></tr>'}</tbody></table></div>`))}
function batchStatus(b){const d=Math.ceil((new Date((b.expiry||dateToday())+"T00:00:00")-new Date(dateToday()+"T00:00:00"))/86400000);return d<0?'<span class="status bad">Vencido</span>':d<=7?'<span class="status warn">Próximo</span>':'<span class="status">Em dia</span>'}
function suppliersPage(){setContent(header("Fornecedores","Cadastre fornecedores e mantenha os contatos à mão.",`<button class="primary" onclick="openSupplier()">＋ Novo fornecedor</button>`)+card("Lista de fornecedores",`<div class="table-wrap"><table><thead><tr><th>Fornecedor</th><th>Contato</th><th>Telefone</th><th>Produtos</th><th>Ações</th></tr></thead><tbody>${state.suppliers.map(s=>`<tr><td><b>${esc(s.name)}</b></td><td>${esc(s.contact||"—")}</td><td>${esc(s.phone||"—")}</td><td>${esc(s.products||"—")}</td><td><button class="danger" onclick="deleteSupplier('${s.id}')">Remover</button></td></tr>`).join("")||'<tr><td colspan="5" class="empty">Nenhum fornecedor cadastrado.</td></tr>'}</tbody></table></div>`))}
function shoppingPage(){const low=state.products.filter(p=>p.minStock>0&&p.stock<=p.minStock);setContent(header("Lista de compras","Sugestão calculada a partir do estoque mínimo. Revise antes de enviar ao fornecedor.",`<button class="primary" onclick="copyShopping()">Copiar lista</button><button onclick="exportShopping()">Baixar CSV</button>`)+card("Itens para reposição — próxima compra",low.length?`<div class="table-wrap"><table><thead><tr><th>Produto</th><th>Estoque atual</th><th>Estoque mínimo</th><th>Sugestão de compra</th></tr></thead><tbody>${low.map(p=>`<tr><td>${esc(p.name)}</td><td>${fmtQty(p.stock,p.unit)}</td><td>${fmtQty(p.minStock,p.unit)}</td><td><b>${fmtQty(Math.max(p.minStock*2-p.stock,0),p.unit)}</b></td></tr>`).join("")}</tbody></table></div><p class="muted" style="font-size:12px;margin-top:12px">A sugestão visa atingir aproximadamente o dobro do estoque mínimo. Ajuste conforme consumo, prazo do fornecedor e necessidade real.</p>`:'<div class="empty">Nenhum produto abaixo do estoque mínimo. Você pode cadastrar mínimos na edição de cada produto.</div>')+card("Pedido semanal de queijos",`<div class="list">${state.products.filter(p=>p.category==="Queijos").map(p=>`<div class="list-item"><div><b>${esc(p.name.replace("Queijo ",""))}</b><small>Disponível: ${fmtQty(p.stock,p.unit)}</small></div><div class="right"><label class="muted">Comprar</label><input type="number" min="0" step=".1" data-buy="${p.id}" placeholder="Qtd." style="width:95px;padding:7px;background:#0a131d;border:1px solid #304256;border-radius:7px;color:white"></div></div>`).join("")}</div><div style="margin-top:14px"><button onclick="copyCheeseOrder()">Copiar pedido de queijos</button></div>`))}
function inventoryPage(){setContent(header("Inventário físico","Compare a contagem real com o estoque do sistema.",`<button class="primary" onclick="openInventory()">＋ Registrar contagem</button>`)+card("Conferência rápida",`<div class="table-wrap"><table><thead><tr><th>Produto</th><th>Estoque no sistema</th><th>Unidade</th><th>Contagem física</th><th>Diferença</th><th></th></tr></thead><tbody>${state.products.map(p=>`<tr><td>${esc(p.name)}</td><td>${fmtQty(p.stock,p.unit)}</td><td>${esc(p.unit)}</td><td><input type="number" step=".001" min="0" data-count="${p.id}" placeholder="Contagem" style="width:100px;padding:7px;background:#0a131d;border:1px solid #304256;border-radius:7px;color:white"></td><td id="diff-${p.id}">—</td><td><button onclick="applyCount('${p.id}')">Aplicar</button></td></tr>`).join("")}</tbody></table></div>`))}
function reportsPage(){setContent(header("Relatórios & backup","Exporte seus dados e mantenha uma cópia segura.",`<button class="primary" onclick="backupJSON()">↓ Backup JSON</button>`)+`<div class="report-grid"><div class="report-tile"><b>📦 Estoque atual</b><p>Lista de produtos, quantidades, unidades, preços e mínimos.</p><button onclick="exportCSV('products')">Exportar CSV</button></div><div class="report-tile"><b>⇄ Movimentações</b><p>Histórico de entradas, retiradas, ajustes e responsáveis.</p><button onclick="exportCSV('movements')">Exportar CSV</button></div><div class="report-tile"><b>🛒 Vendas do bar</b><p>Vendas registradas, itens, total e observações.</p><button onclick="exportCSV('sales')">Exportar CSV</button></div><div class="report-tile"><b>◷ Lotes e validades</b><p>Datas de validade, quantidades e identificação de lote.</p><button onclick="exportCSV('batches')">Exportar CSV</button></div><div class="report-tile"><b>🏪 Fornecedores</b><p>Contatos e categorias de produtos fornecidos.</p><button onclick="exportCSV('suppliers')">Exportar CSV</button></div><div class="report-tile"><b>↻ Restaurar backup</b><p>Importe um arquivo JSON exportado anteriormente.</p><input type="file" id="restoreFile" accept=".json,application/json" style="font-size:11px;max-width:100%;margin-top:6px"><button style="margin-top:8px" onclick="restoreJSON()">Restaurar</button></div></div>`)}
function settingsPage(){setContent(header("Configurações","Conecte o banco compartilhado e configure alertas.",`<button class="primary" onclick="saveSettings()">Salvar configuração</button>`)+`<div class="config-panel">${`<div class="notice"><strong>Importante:</strong> o sistema está em modo local enquanto as credenciais do Supabase não forem preenchidas. Nesse modo, cada navegador tem seus próprios dados. Para sincronizar, configure o banco conforme o arquivo README e SQL incluídos no projeto. Nunca cole a chave service_role aqui.</div>`}${card("Conexão com Supabase",`<div class="field"><label>Project URL</label><input id="sbUrl" placeholder="https://seu-projeto.supabase.co" value="${esc(CONFIG.supabaseUrl)}"></div><div class="field"><label>Publishable key / anon key</label><input id="sbKey" placeholder="Chave pública do projeto" value="${esc(CONFIG.supabaseAnonKey)}"></div><p class="muted" style="font-size:12px">As credenciais ficam salvas neste navegador. A chave pública não deve ser confundida com a chave secreta de serviço.</p>`)}${card("Preferências de estoque",`<div class="field"><label>Alertar validade em até (dias)</label><input id="expiryDays" type="number" min="1" value="${CONFIG.expiryWarningDays}"></div><div class="field"><label>Estoque mínimo padrão</label><input id="lowStock" type="number" min="0" value="${CONFIG.lowStockDefault}"></div><button onclick="testConnection()">Testar conexão</button>`)}${card("Privacidade e acesso",`<p style="line-height:1.6;color:var(--muted)">Como você optou por não usar login, o acesso de escrita precisa ser protegido no banco ou por uma camada de servidor. Não configure políticas de banco que permitam livremente inserir, alterar e apagar dados a qualquer visitante. O README explica as opções recomendadas.</p>`)}</div>`)}
function render(){switch(state.page){case"dashboard":dashboard();break;case"products":productsPage();break;case"sales":salesPage();break;case"movements":movementPage();break;case"cheeses":categoryPage("Queijos","Controle de queijos","Registre peças, pesos, cortes e necessidade de reposição semanal.");break;case"salami":categoryPage("Salames","Salames & validades","Controle de peso, lotes e datas de vencimento.");break;case"suppliers":suppliersPage();break;case"shopping":shoppingPage();break;case"inventory":inventoryPage();break;case"reports":reportsPage();break;case"settings":settingsPage();break;}}

function modal(title,body,submitLabel,submitFn){$("#modalContent").innerHTML=`<h2>${title}</h2>${body}<div class="modal-actions"><button class="ghost" onclick="closeModal()">Cancelar</button><button class="primary" id="modalSubmit">${submitLabel||"Salvar"}</button></div>`;$("#modalBackdrop").classList.add("open");$("#modalSubmit").onclick=submitFn}
function closeModal(){$("#modalBackdrop").classList.remove("open")}
$("#modalBackdrop").addEventListener("click",e=>{if(e.target.id==="modalBackdrop")closeModal()});
function val(id){return document.getElementById(id)?.value?.trim()||""}
function openProduct(id="",category="Bebidas"){const p=state.products.find(x=>x.id===id)||{name:"",category,unit:category==="Queijos"||category==="Salames"?"kg":"un",price:category==="Bebidas"?8:category==="Sucos"?12:category==="Águas"?6:0,stock:0,minStock:category==="Queijos"||category==="Salames"?0:10};modal(id?"Editar produto":"Novo produto",`<div class="form-grid"><div class="field full"><label>Nome do produto *</label><input id="pName" value="${esc(p.name)}" required></div><div class="field"><label>Categoria</label><select id="pCategory">${["Bebidas","Sucos","Águas","Queijos","Salames","Outros"].map(c=>`<option ${p.category===c?"selected":""}>${c}</option>`).join("")}</select></div><div class="field"><label>Unidade de controle</label><select id="pUnit">${["un","kg","g","L","caixa","peça"].map(c=>`<option ${p.unit===c?"selected":""}>${c}</option>`).join("")}</select></div><div class="field"><label>Preço de venda (R$)</label><input id="pPrice" type="number" min="0" step=".01" value="${Number(p.price||0)}"></div><div class="field"><label>Estoque mínimo</label><input id="pMin" type="number" min="0" step=".001" value="${Number(p.minStock||0)}"></div>${id?`<div class="field"><label>Estoque atual (somente ajuste)</label><input id="pStock" type="number" min="0" step=".001" value="${Number(p.stock||0)}"></div>`:""}</div>`, "Salvar produto",async()=>{const name=val("pName");if(!name)return toast("Informe o nome do produto.");const obj={...p,id:p.id||uid(),name,category:val("pCategory"),unit:val("pUnit"),price:Number(val("pPrice")||0),minStock:Number(val("pMin")||0),stock:id?Number(val("pStock")||0):0,active:true};const idx=state.products.findIndex(x=>x.id===obj.id);if(idx>=0)state.products[idx]=obj;else state.products.push(obj);try{await persist("products",obj);closeModal();render();toast("Produto salvo.");}catch{}})}
async function deleteProduct(id){const p=state.products.find(x=>x.id===id);if(!p||!confirm(`Remover "${p.name}" do catálogo? O histórico será mantido.`))return;state.products=state.products.filter(x=>x.id!==id);try{await persist("products",p,"delete");render();toast("Produto removido.");}catch{}}
function openMovement(type="saida",category="",productId=""){const choices=state.products.filter(p=>!category||p.category===category);modal(type==="entrada"?"Registrar entrada":type==="ajuste"?"Ajustar estoque":"Registrar retirada/corte",`<div class="form-grid"><div class="field full"><label>Produto *</label><select id="mProduct">${choices.map(p=>`<option value="${p.id}" ${p.id===productId?"selected":""}>${esc(p.name)} — ${fmtQty(p.stock,p.unit)}</option>`).join("")}</select></div><div class="field"><label>Tipo</label><select id="mType"><option value="entrada" ${type==="entrada"?"selected":""}>Entrada</option><option value="saida" ${type==="saida"?"selected":""}>Retirada / corte</option><option value="ajuste" ${type==="ajuste"?"selected":""}>Ajuste de inventário</option></select></div><div class="field"><label>Quantidade *</label><input id="mQty" type="number" min=".001" step=".001" placeholder="Ex.: 2 ou 0,350"></div><div class="field full"><label>Motivo *</label><select id="mReason"><option>Reposição/compra</option><option>Corte para buffet</option><option>Consumo interno</option><option>Perda/desperdício</option><option>Descarte/vencimento</option><option>Ajuste de inventário</option><option>Outro</option></select></div><div class="field"><label>Responsável</label><input id="mResponsible" placeholder="Nome do funcionário"></div><div class="field"><label>Observação</label><input id="mNote" placeholder="Opcional"></div></div>`, "Registrar movimentação",async()=>{const p=state.products.find(x=>x.id===val("mProduct")),t=val("mType"),q=Number(val("mQty"));if(!p||!q||q<=0)return toast("Selecione o produto e informe uma quantidade válida.");if(t==="saida"&&q>Number(p.stock))return toast("Estoque insuficiente para essa retirada.");const old=Number(p.stock);p.stock=t==="entrada"?old+q:t==="saida"?old-q:q;const m={id:uid(),product_id:p.id,product_name:p.name,type:t,quantity:q,unit:p.unit,reason:val("mReason"),responsible:val("mResponsible"),note:val("mNote"),stock_before:old,stock_after:p.stock,created_at:new Date().toISOString()};state.movements.push(m);try{await persist("products",p);await persist("movements",m);closeModal();render();toast("Movimentação registrada.");}catch{}})}
function openSale(){const drinks=state.products.filter(p=>["Bebidas","Sucos","Águas"].includes(p.category));modal("Registrar venda do bar",`<p class="muted" style="font-size:12px;margin-top:-8px">Informe as quantidades vendidas. O estoque será baixado automaticamente.</p><div id="saleLines">${drinks.map(p=>`<div class="list-item" style="align-items:center"><div><b>${esc(p.name)}</b><small>${fmtMoney(p.price)} · disponível ${fmtQty(p.stock,p.unit)}</small></div><div style="width:90px"><input data-sale="${p.id}" data-price="${p.price}" data-name="${esc(p.name)}" type="number" min="0" step="1" value="0" style="width:100%;padding:8px;background:#0a131d;border:1px solid #304256;border-radius:7px;color:white" aria-label="Quantidade ${esc(p.name)}"></div></div>`).join("")}</div><div class="field" style="margin-top:14px"><label>Responsável</label><input id="saleResponsible" placeholder="Nome do funcionário"></div><div class="field"><label>Observação</label><input id="saleNote" placeholder="Opcional"></div><p id="saleTotal" style="font:800 20px Manrope">Total: R$ 0,00</p>`, "Confirmar venda",async()=>{const inputs=[...document.querySelectorAll("[data-sale]")],items=inputs.map(i=>({product_id:i.dataset.sale,name:i.dataset.name,price:Number(i.dataset.price),quantity:Number(i.value||0)})).filter(i=>i.quantity>0);if(!items.length)return toast("Informe ao menos um item.");for(const it of items){const p=state.products.find(p=>p.id===it.product_id);if(it.quantity>p.stock)return toast(`Estoque insuficiente: ${p.name}.`)}const total=items.reduce((a,i)=>a+i.price*i.quantity,0),sale={id:uid(),items,total,responsible:val("saleResponsible"),note:val("saleNote"),created_at:new Date().toISOString()};for(const it of items){const p=state.products.find(p=>p.id===it.product_id),old=Number(p.stock);p.stock-=it.quantity;state.movements.push({id:uid(),product_id:p.id,product_name:p.name,type:"saida",quantity:it.quantity,unit:p.unit,reason:"Venda do bar",responsible:sale.responsible,note:"Venda "+sale.id,stock_before:old,stock_after:p.stock,created_at:sale.created_at})}state.sales.push(sale);try{for(const it of items){await persist("products",state.products.find(p=>p.id===it.product_id))}for(const m of state.movements.filter(m=>m.note==="Venda "+sale.id))await persist("movements",m);await persist("sales",sale);closeModal();render();toast("Venda registrada: "+fmtMoney(total));}catch{}});document.querySelectorAll("[data-sale]").forEach(i=>i.addEventListener("input",()=>{const total=[...document.querySelectorAll("[data-sale]")].reduce((a,x)=>a+Number(x.value||0)*Number(x.dataset.price),0);$("#saleTotal").textContent="Total: "+fmtMoney(total)}))}
function openBatch(productId=""){const p=state.products.find(p=>p.id===productId);modal("Cadastrar lote e validade",`<div class="form-grid"><div class="field full"><label>Produto *</label><select id="bProduct">${state.products.map(p=>`<option value="${p.id}" ${p.id===productId?"selected":""}>${esc(p.name)}</option>`).join("")}</select></div><div class="field"><label>Identificação do lote</label><input id="bLot" placeholder="Ex.: lote 123"></div><div class="field"><label>Quantidade no lote *</label><input id="bQty" type="number" min=".001" step=".001" value="1"></div><div class="field"><label>Unidade</label><select id="bUnit">${["kg","un","g","L","peça"].map(u=>`<option ${(p?.unit||"kg")===u?"selected":""}>${u}</option>`).join("")}</select></div><div class="field"><label>Data de validade *</label><input id="bExpiry" type="date" required></div><div class="field full"><label>Data de abertura (opcional)</label><input id="bOpened" type="date"></div></div>`, "Salvar lote",async()=>{const product=state.products.find(p=>p.id===val("bProduct")),qty=Number(val("bQty")),expiry=val("bExpiry");if(!product||qty<=0||!expiry)return toast("Informe produto, quantidade e validade.");const b={id:uid(),product_id:product.id,product_name:product.name,lot:val("bLot"),quantity:qty,unit:val("bUnit"),expiry,opened_at:val("bOpened")||null,created_at:new Date().toISOString()};state.batches.push(b);try{await persist("batches",b);closeModal();render();toast("Lote cadastrado.");}catch{}})}
function openSupplier(){modal("Novo fornecedor",`<div class="field"><label>Nome do fornecedor *</label><input id="sName"></div><div class="field"><label>Contato</label><input id="sContact"></div><div class="field"><label>Telefone</label><input id="sPhone"></div><div class="field"><label>Produtos fornecidos</label><input id="sProducts" placeholder="Queijos, salames, bebidas..."></div><div class="field"><label>Observações</label><textarea id="sNotes" rows="2"></textarea></div>`,"Salvar fornecedor",async()=>{if(!val("sName"))return toast("Informe o fornecedor.");const s={id:uid(),name:val("sName"),contact:val("sContact"),phone:val("sPhone"),products:val("sProducts"),notes:val("sNotes"),created_at:new Date().toISOString()};state.suppliers.push(s);try{await persist("suppliers",s);closeModal();render();toast("Fornecedor cadastrado.");}catch{}})}
async function deleteSupplier(id){const s=state.suppliers.find(s=>s.id===id);if(!s||!confirm("Remover fornecedor?"))return;state.suppliers=state.suppliers.filter(s=>s.id!==id);try{await persist("suppliers",s,"delete");render()}catch{}}
function openInventory(){modal("Registrar contagem de inventário",`<p class="muted">Informe o produto e a quantidade física contada. A diferença será registrada como ajuste.</p><div class="field"><label>Produto</label><select id="iProduct">${state.products.map(p=>`<option value="${p.id}">${esc(p.name)} — sistema: ${fmtQty(p.stock,p.unit)}</option>`).join("")}</select></div><div class="field"><label>Quantidade física *</label><input id="iQty" type="number" min="0" step=".001"></div><div class="field"><label>Responsável</label><input id="iResponsible"></div><div class="field"><label>Observação</label><input id="iNote"></div>`,"Registrar ajuste",async()=>{const p=state.products.find(p=>p.id===val("iProduct")),q=Number(val("iQty"));if(!p||val("iQty")===""||q<0)return toast("Informe a contagem física.");const old=Number(p.stock),diff=q-old;p.stock=q;const m={id:uid(),product_id:p.id,product_name:p.name,type:"ajuste",quantity:Math.abs(diff),unit:p.unit,reason:"Ajuste de inventário",responsible:val("iResponsible"),note:`Contagem: ${q}. ${val("iNote")}`,stock_before:old,stock_after:q,created_at:new Date().toISOString()};state.movements.push(m);try{await persist("products",p);await persist("movements",m);closeModal();render();toast("Inventário atualizado.");}catch{}})}
function applyCount(id){const input=document.querySelector(`[data-count="${id}"]`);if(!input||input.value==="")return toast("Informe a contagem física.");const p=state.products.find(p=>p.id===id),q=Number(input.value);if(q<0)return;const d=document.querySelector(`#diff-${id}`);d.textContent=(q-p.stock>0?"+":"")+(q-p.stock).toLocaleString("pt-BR");openInventory();document.querySelector("#iProduct").value=id;document.querySelector("#iQty").value=q}
function copyShopping(){const low=state.products.filter(p=>p.minStock>0&&p.stock<=p.minStock);const text=low.map(p=>`${p.name}: comprar ${Math.max(p.minStock*2-p.stock,0)} ${p.unit} (estoque ${p.stock})`).join("\n")||"Nenhum item abaixo do estoque mínimo.";navigator.clipboard?.writeText(text).then(()=>toast("Lista copiada."),()=>toast(text))}
function copyCheeseOrder(){const items=[...document.querySelectorAll("[data-buy]")].filter(i=>Number(i.value)>0).map(i=>`${state.products.find(p=>p.id===i.dataset.buy).name}: ${i.value} ${state.products.find(p=>p.id===i.dataset.buy).unit}`);if(!items.length)return toast("Informe ao menos uma quantidade de compra.");const text="Pedido semanal de queijos:\n"+items.join("\n");navigator.clipboard?.writeText(text).then(()=>toast("Pedido copiado."),()=>toast(text))}
function exportShopping(){const rows=state.products.filter(p=>p.minStock>0&&p.stock<=p.minStock).map(p=>({produto:p.name,estoque:p.stock,unidade:p.unit,comprar:Math.max(p.minStock*2-p.stock,0)}));downloadCSV("lista-compras.csv",rows)}
function exportCSV(key){downloadCSV(`${key}-${dateToday()}.csv`,state[key]||[])}
function downloadCSV(filename,rows){if(!rows.length)return toast("Não há dados para exportar.");const keys=[...new Set(rows.flatMap(r=>Object.keys(r)))];const csv=[keys.join(";"),...rows.map(r=>keys.map(k=>{let v=r[k];if(v&&typeof v==="object")v=JSON.stringify(v);return `"${String(v??"").replace(/"/g,'""')}"`}).join(";"))].join("\r\n");const blob=new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8;"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=filename;a.click();URL.revokeObjectURL(a.href);toast("Arquivo exportado.")}
function backupJSON(){const blob=new Blob([JSON.stringify({version:1,exportedAt:new Date().toISOString(),products:state.products,movements:state.movements,sales:state.sales,suppliers:state.suppliers,batches:state.batches},null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`stockroom-backup-${dateToday()}.json`;a.click();URL.revokeObjectURL(a.href);toast("Backup JSON exportado.")}
async function restoreJSON(){const file=$("#restoreFile").files[0];if(!file)return toast("Selecione um arquivo JSON.");try{const d=JSON.parse(await file.text());if(!confirm("Restaurar este backup substituirá os dados atuais neste sistema. Continuar?"))return;for(const k of ["products","movements","sales","suppliers","batches"])if(Array.isArray(d[k]))state[k]=d[k];saveLocal();if(state.client){for(const k of ["products","movements","sales","suppliers","batches"]){const {error}=await state.client.from(k).upsert(state[k]);if(error)throw error}}render();toast("Backup restaurado.");}catch(e){toast("Não foi possível restaurar: "+e.message)}}
function saveSettings(){CONFIG.supabaseUrl=val("sbUrl");CONFIG.supabaseAnonKey=val("sbKey");CONFIG.expiryWarningDays=Math.max(1,Number(val("expiryDays")||7));CONFIG.lowStockDefault=Math.max(0,Number(val("lowStock")||10));localStorage.setItem("stockroom-config",JSON.stringify(CONFIG));toast("Preferências salvas. Recarregando para aplicar a conexão...");setTimeout(()=>location.reload(),700)}
async function testConnection(){const url=val("sbUrl"),key=val("sbKey");if(!url||!key)return toast("Preencha a URL e a chave pública.");try{const c=window.supabase.createClient(url,key);const {error}=await c.from("products").select("id").limit(1);if(error)throw error;toast("Conexão bem-sucedida.");}catch(e){toast("Falha no teste: "+e.message)}}
(function loadConfig(){try{const c=JSON.parse(localStorage.getItem("stockroom-config")||"null");if(c)Object.assign(CONFIG,c)}catch{}})();
init();
</script>
</body>
