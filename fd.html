<style>
*{
box-sizing: border-box;
}
html, body{
margin:0;
background: #002613;

}

header {
text-align: center;
}
header img{
width: 450px;
height: auto;
user-select: none;
-webkit-user-select: none;
-webkit-user-drag: none;
-moz-user-focus: none;
-ms-user-select: none;
}
header input{
border: 1px solid #00FF7F;
background: #700000;
box-shadow: 3px 3px 15px #4CE411;
}
#search_id {
  width: 100%;
  padding: 10px;
  margin: 20px 0;
  border-radius: 5px;
  border: none;
  font-size: 16px;
}

.card {
    background-color: #111;
    border: 1px solid #00ff00;
    border-radius: 10px;
    padding: 15px;
    margin: 10px 0;
    transition: transform 0.2s;
  }
.card:hover {
    transform: scale(1.02);
  }
.destaque {
    border-color: #ff0000;
    color: #ff4444;
  }
</style>
<body>
<header>
<img src="assets/img/img_header.webp" alt="header image" type="image/webp"/>
<input type="text" name="search" id="search_id" placeholder="Search name..." />
</header>


<section>

<div id="database"></div>

</section>

<footer>

</footer>
<script type="text/javascript" charset="utf-8" defer async crossorigin="anonymous">

const soldados = [
{
img_url: "https://3asyice.github.io/SixOhNine/assets/img/sd/carvalho.jpg",
nome: "Carvalho",
numero: "609",
status: "Desligado",
fullname: "Guilherme de Abreu Carvalho",
apelido: "Superman",
data_nascimento: "27/01/2005",
setor: "EB F@cil",
descricao: "Soldado expulso em 11 de julho de 2024 após resultado de sindicância.",
},
{
img_url: "",
  nome: "Fabian Gabriel Murini Tassinari",
  numero: "601",
  status: "Ativo",
  fullname: "Fabian Gabriel Murini Tassinari",
  apelido: "",
  data_nascimento: "10/03/2004",
  setor: "Hotel de Trânsito",
  descricao: "Soldado ativo no setor de Hotel de Trânsito.",
  cor: "#fff" // <-- cor diferente
}
];

const db = document.getElementById('database');

function showList(filter = ""){
db.innerHTML = "";
soldados
.filter(s =>
s.nome.toLowerCase().includes(filter.toLowerCase()) || 
s.numero.includes(filter)
)

.forEach(s => {
const card = document.createElement('div');
card.className = 'card';
card.style.borderColor = s.cor;
card.style.color = s.cor;
card.style.fontSize = "0.8em";
card.style.fontFamily = "monospace";
card.style.color = "green";

if (s.numero === '609') card.classList.add("destaque");
card.innerHTML = `
<img style="float:left;margin-right:10px;" width="60px" height="60px" src="${s.img_url}"/> <br>
  <strong>${s.numero} - ${s.nome}</strong><br>
  Status: ${s.status}<br>
  Nome Completo: ${s.fullname}
  ${s.apelido ? `<br>Apelido: ${s.apelido}` : ""} <br>
  Nascimento: ${s.data_nascimento}<br>
  Seção: ${s.setor}<br>
  Informação: ${s.descricao}
`;
db.appendChild(card);
});}


document.getElementById('search_id').addEventListener("input", (e) => {
  showList(e.target.value);
});
showList();
</script>
</body>
