<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Simulação: Interferência de Dupla Fenda (HTML + JS)</title>
<style>
  body { font-family: Arial, sans-serif; margin: 12px; background:#111; color:#eee; }
  h1 { font-size:18px; margin:0 0 8px 0; }
  .controls { display:flex; gap:12px; flex-wrap:wrap; margin:8px 0 12px 0; }
  .control { display:flex; flex-direction:column; font-size:13px; }
  label { font-size:12px; color:#ccc; margin-bottom:4px; }
  input[type="range"] { width:200px; }
  canvas { border-radius:6px; display:block; background:#000; box-shadow:0 6px 18px rgba(0,0,0,0.6); }
  .footer { margin-top:10px; font-size:12px; color:#aaa; }
  .row { display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  button { padding:6px 10px; border-radius:6px; background:#2a2a2a; color:#fff; border:1px solid #333; cursor:pointer; }
  button:hover { filter:brightness(1.2); }
</style>
</head>
<body>
  <h1>Simulação: Interferência de Dupla Fenda (HTML + JS)</h1>

  <div class="controls">
    <div class="control">
      <label>Comprimento de onda λ (pixels)</label>
      <input id="lambda" type="range" min="10" max="200" value="80">
      <div class="row"><span id="lambdaVal">80</span></div>
    </div>

    <div class="control">
      <label>Separação entre fendas (pixels)</label>
      <input id="sep" type="range" min="10" max="300" value="120">
      <div class="row"><span id="sepVal">120</span></div>
    </div>

    <div class="control">
      <label>Largura da fenda σ (pixels)</label>
      <input id="sigma" type="range" min="5" max="80" value="12">
      <div class="row"><span id="sigmaVal">12</span></div>
    </div>

    <div class="control">
      <label>Velocidade animação (ms por frame)</label>
      <input id="fps" type="range" min="10" max="200" value="40">
      <div class="row"><span id="fpsVal">40</span></div>
    </div>

    <div style="align-self:flex-end;">
      <button id="toggle">Pausar</button>
      <button id="reset">Reset</button>
    </div>
  </div>

  <canvas id="canvas" width="900" height="320"></canvas>

  <div class="footer">
    Observação: isto é uma <strong>simulação numérica aproximada</strong> — não é um experimento de laboratório. Para experimentos reais é preciso equipamento, segurança e conhecimento.
  </div>

<script>
/* --- Parâmetros e utilitários --- */
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;
const screenY = Math.floor(H*0.65); // posição da "tela" vertical (apenas visual)
let time = 0;
let running = true;

const el = id => document.getElementById(id);
const lambdaEl = el('lambda'), sepEl = el('sep'), sigmaEl = el('sigma'), fpsEl = el('fps');
const lambdaVal = el('lambdaVal'), sepVal = el('sepVal'), sigmaVal = el('sigmaVal'), fpsVal = el('fpsVal');
const toggleBtn = el('toggle'), resetBtn = el('reset');

function updateLabels(){
  lambdaVal.textContent = lambdaEl.value;
  sepVal.textContent = sepEl.value;
  sigmaVal.textContent = sigmaEl.value;
  fpsVal.textContent = fpsEl.value;
}
updateLabels();

[lambdaEl, sepEl, sigmaEl, fpsEl].forEach(input=>{
  input.addEventListener('input', ()=> { updateLabels(); });
});

/* --- Física simplificada --- */
/*
 We'll compute psi(x) = psi1 + psi2 on an x-grid.
 psi_j(x) = A * exp(i * k * r_j) * exp( - (x - xj)^2 / (2*sigma^2) )
 We'll vary phase with time to animate (global oscillation).
*/

function complexAdd(a, b){ return {r: a.r + b.r, i: a.i + b.i}; }
function complexAbs2(c){ return c.r*c.r + c.i*c.i; }
function complexExpPhase(phase){ return {r: Math.cos(phase), i: Math.sin(phase)}; }

function computeIntensityArray(){
  const N = W; // points across width
  const intens = new Float32Array(N);
  const lam = Number(lambdaEl.value);
  const k = 2 * Math.PI / lam; // wave number (pixels^-1)
  const sep = Number(sepEl.value);
  const sigma = Number(sigmaEl.value);
  const x1 = W/2 - sep/2, x2 = W/2 + sep/2;
  const A = 1.0;
  const globalPhase = time * 0.03; // animate slowly

  for(let xi=0; xi<N; xi++){
    const x = xi + 0.5;
    // distance approximation 1D (we're not doing radial falloff)
    // phase from propagation: k * (x - xj)
    const phase1 = k * (x - x1) + globalPhase;
    const phase2 = k * (x - x2) + globalPhase;
    const env1 = Math.exp( - ((x - x1)*(x - x1)) / (2 * sigma * sigma) );
    const env2 = Math.exp( - ((x - x2)*(x - x2)) / (2 * sigma * sigma) );
    const psi1 = { r: A * env1 * Math.cos(phase1), i: A * env1 * Math.sin(phase1) };
    const psi2 = { r: A * env2 * Math.cos(phase2), i: A * env2 * Math.sin(phase2) };
    const psi = complexAdd(psi1, psi2);
    intens[xi] = complexAbs2(psi);
  }
  return intens;
}

/* --- Renderizar --- */
function render(){
  // clear
  ctx.clearRect(0,0,W,H);

  // background
  ctx.fillStyle = '#000';
  ctx.fillRect(0,0,W,H);

  // draw slits (top)
  const sep = Number(sepEl.value);
  const slitY = Math.floor(H*0.18);
  const x1 = W/2 - sep/2, x2 = W/2 + sep/2;
  ctx.fillStyle = '#444';
  ctx.fillRect(0, slitY-8, W, 16);
  // slits (holes)
  ctx.fillStyle = '#111';
  ctx.fillRect(x1-8, slitY-60, 16, 60);
  ctx.fillRect(x2-8, slitY-60, 16, 60);

  // compute intensities
  const intens = computeIntensityArray();

  // normalize intensity for display
  let maxI = 0;
  for(let i=0;i<intens.length;i++) if(intens[i] > maxI) maxI = intens[i];
  const norm = maxI > 0 ? 1.0 / maxI : 1.0;

  // draw intensity as vertical "screen" pattern below slits
  for(let x=0;x<W;x++){
    const val = intens[x] * norm;
    // map val to brightness (0..255)
    let bright = Math.pow(val, 0.6) * 255; // gamma adjust for nicer contrast
    if(bright > 255) bright = 255;
    const y0 = screenY;
    // draw a vertical column: brighter = taller white column up from y0
    const h = Math.floor(bright / 255 * (H - y0 - 10));
    ctx.fillStyle = `rgb(${Math.floor(bright)},${Math.floor(bright)},${Math.floor(bright)})`;
    ctx.fillRect(x, y0, 1, h);
  }

  // labels
  ctx.fillStyle = '#bbb';
  ctx.font = '12px Arial';
  ctx.fillText('Fendas', 10, slitY-12);
  ctx.fillText('Tela (intensidade = |ψ|²)', 10, screenY - 6);
}

/* --- Loop de animação --- */
function step(){
  if(running){
    time++;
    render();
  }
  const delay = Number(fpsEl.value);
  setTimeout(step, delay);
}
step();

/* --- Botões --- */
toggleBtn.addEventListener('click', ()=>{
  running = !running;
  toggleBtn.textContent = running ? 'Pausar' : 'Continuar';
});
resetBtn.addEventListener('click', ()=>{
  lambdaEl.value = 80; sepEl.value = 120; sigmaEl.value = 12; fpsEl.value = 40;
  updateLabels();
});

/* Inicial render */
render();
</script>
</body>
</html>
